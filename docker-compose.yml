version: '3.8'

services:
  # ─── MongoDB ─────────────────────────────────────────────────────
  mongodb:
    image: mongo:7
    container_name: mongodb
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db
    networks:
      - app-network
    restart: unless-stopped

  # ─── Auth Service ────────────────────────────────────────────────
  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: auth-service
    ports:
      - '5000:5000'
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGO_URI=${MONGO_URI:-mongodb://mongodb:27017/auth_service_db}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=7d
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_CALLBACK_URL=${GOOGLE_CALLBACK_URL}
      - RABBITMQ_URL=${RABBITMQ_URL}
      - CLIENT_URL=http://localhost:3000
    depends_on:
      - mongodb
    networks:
      - app-network
    restart: unless-stopped

  # ─── Notification Service ────────────────────────────────────────
  notification-service:
    build:
      context: ./notification-service
      dockerfile: Dockerfile
    container_name: notification-service
    ports:
      - '5001:5001'
    environment:
      - PORT=5001
      - NODE_ENV=production
      - RABBITMQ_URL=${RABBITMQ_URL}
      - GMAIL_CLIENT_ID=${GMAIL_CLIENT_ID}
      - GMAIL_CLIENT_SECRET=${GMAIL_CLIENT_SECRET}
      - GMAIL_REDIRECT_URI=${GMAIL_REDIRECT_URI}
      - GMAIL_REFRESH_TOKEN=${GMAIL_REFRESH_TOKEN}
      - GMAIL_USER=${GMAIL_USER}
      - CLIENT_URL=http://localhost:3000
    networks:
      - app-network
    restart: unless-stopped

  # ─── Music Service ───────────────────────────────────────────────
  music-service:
    build:
      context: ./music-service
      dockerfile: Dockerfile
    container_name: music-service
    ports:
      - '5002:5002'
    environment:
      - PORT=5002
      - NODE_ENV=production
      - MONGO_URI=${MONGO_URI:-mongodb://mongodb:27017/auth_service_db}
      - JWT_SECRET=${JWT_SECRET}
      - RABBITMQ_URL=${RABBITMQ_URL}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION:-ap-south-1}
      - AWS_S3_BUCKET_NAME=${AWS_S3_BUCKET_NAME:-spotify-project-2-bucket}
      - CLIENT_URL=http://localhost:3000
    depends_on:
      - mongodb
    networks:
      - app-network
    restart: unless-stopped

  # ─── Frontend ────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    ports:
      - '3000:3000'
    environment:
      - AUTH_SERVICE_URL=http://auth-service:5000
      - MUSIC_SERVICE_URL=http://music-service:5002
    depends_on:
      - auth-service
      - music-service
    networks:
      - app-network
    restart: unless-stopped

volumes:
  mongo-data:

networks:
  app-network:
    driver: bridge
